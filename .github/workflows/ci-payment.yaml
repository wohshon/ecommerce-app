name: Build and Update Payment Service

on:
  push:
    branches:
      - staging
    paths:
      - 'payment-service/**'

env:
  IMAGE_NAME: "docker.io/wohshon/payment-service"
  INFRA_REPO: "wohshon/ecommerce-infra"

jobs:
  deploy-staging:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging-latest

      - name: Checkout Infra Repo (Staging)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra
          ref: staging

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Staging Overlay
        run: |
          cd infra/k8s/overlays/staging
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and Push to Staging
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "deploy(staging): update payment-service image to ${{ github.sha }}"
          git push origin staging

  deploy-production:
    name: Promote to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Infra Repo (Production)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra
          ref: production

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Production Overlay
        run: |
          cd infra/k8s/overlays/production
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ needs.deploy-staging.outputs.image_tag }}

      - name: Commit and Push to Production
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "deploy(prod): promote payment-service image to ${{ needs.deploy-staging.outputs.image_tag }}"
          git push origin production
