name: Build and Update Product Service

on:
  push:
    branches:
      - demo
    paths:
      - 'product-service/**'

env:
  # Matches docker.io/wohshon/product-service in deployment.yaml
  IMAGE_NAME: "docker.io/wohshon/product-service" 
  INFRA_REPO: "wohshon/ecommerce-infra"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra
          ref: demo

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kustomize Image Tag
        run: |
          cd infra/k8s/product-service
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and Push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/product-service/kustomization.yaml
          git commit -m "deploy: update product-service image to ${{ github.sha }}"
          git push
