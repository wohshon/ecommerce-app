name: Build and Update Frontend

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'frontend/**'

env:
  IMAGE_NAME: "docker.io/wohshon/frontend"
  INFRA_REPO: "wohshon/ecommerce-infra"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-latest

      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra
          ref: ${{ github.ref_name }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kustomize Image Tag
        run: |
          cd infra/k8s/base/frontend
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and Push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend/kustomization.yaml
          git commit -m "deploy(${{ github.ref_name }}): update frontend image to ${{ github.sha }}"
          git push origin ${{ github.ref_name }}
