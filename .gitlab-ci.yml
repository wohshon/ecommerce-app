stages:
  - build
  - ai_review
  - trigger

image: docker:24.0.7
services:
  - name: docker:24-dind
    command: ["--insecure-registry=registry.wskn.local"]


variables:
  GIT_SSL_NO_VERIFY: "true"
  REGISTRY_URL: "registry.wskn.local"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  CI_API_V4_URL: "https://gitlab.wskn.local/api/v4"
  INFRA_PROJECT_ID: "2"  # Replace with your actual infra project ID

# ----------------------
# Build Jobs
# ----------------------

build-frontend:
  stage: build
  before_script:
    - cp /tmp/ca-cert/ca.crt /usr/local/share/ca-certificates/
    - update-ca-certificates || true      
    - until docker info; do echo "Waiting for Docker daemon..."; sleep 3; done
    - echo "$DOCKER_PASSWORD" | docker login https://$REGISTRY_URL -u "$DOCKER_USERNAME" --password-stdin
    #- mkdir -p /etc/docker/certs.d/wskn.local
    #- echo "$REGISTRY_CA_CERT" | base64 -d > /etc/docker/certs.d/wskn.local/wskn.local.crt
  script:
    - docker build -t $REGISTRY_URL/$DOCKER_USERNAME/frontend:latest ./frontend
    - docker push $REGISTRY_URL/$DOCKER_USERNAME/frontend:latest
    - IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $REGISTRY_URL/$DOCKER_USERNAME/frontend:latest)
    - echo "SERVICE_NAME=frontend" >> frontend.env
    - echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> frontend.env
  artifacts:
    paths:
      - frontend.env
    reports:
      dotenv: frontend.env
  rules:
    - changes:
        - frontend/**/*

