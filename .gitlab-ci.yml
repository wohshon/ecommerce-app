stages:
  - build
  - ai_decide_tests
  - trigger

image: docker:24.0.7
services:
  - name: docker:24-dind
    command: ["--insecure-registry=registry.wskn.local"]

variables:
  GIT_SSL_NO_VERIFY: "true"
  REGISTRY_URL: "registry.wskn.local"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  CI_API_V4_URL: "https://gitlab.wskn.local/api/v4"
  INFRA_PROJECT_ID: "2"

# ----------------------
# Build Jobs
# ----------------------

build-frontend:
  stage: build
  before_script:
    - cp /tmp/ca-cert/ca.crt /usr/local/share/ca-certificates/
    - update-ca-certificates || true
    - until docker info; do echo "Waiting for Docker daemon..."; sleep 3; done
    - echo "$DOCKER_PASSWORD" | docker login https://$REGISTRY_URL -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $REGISTRY_URL/$DOCKER_USERNAME/frontend:latest ./frontend
    - docker push $REGISTRY_URL/$DOCKER_USERNAME/frontend:latest
    - IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $REGISTRY_URL/$DOCKER_USERNAME/frontend:latest)
    - echo "SERVICE_NAME=frontend" >> frontend.env
    - echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> frontend.env
  artifacts:
    paths:
      - frontend.env
    reports:
      dotenv: frontend.env
  rules:
    - changes:
        - frontend/**/*

# Similar build-* jobs for order-service, payment-service, product-service
# (omitted for brevity, same style as build-frontend)

# ----------------------
# AI Risk Analysis Job
# ----------------------
ai-risk-analysis:
  stage: ai_decide_tests
  image: python:3.11
  before_script:
    - apt-get update && apt-get install -y jq curl git
    - pip install requests
  script:
    - |
      echo "Collecting changed files..."
      TARGET_BRANCH=${CI_MERGE_REQUEST_TARGET_BRANCH:-$(git remote show origin | awk '/HEAD branch/ {print $NF}')}
      echo "Comparing current branch ($CI_COMMIT_REF_NAME) with target ($TARGET_BRANCH)"
      git fetch origin "$TARGET_BRANCH" || echo "⚠️ Failed to fetch target branch, continuing with HEAD only"
      CHANGED_FILES=$(git diff --name-only origin/"$TARGET_BRANCH"...HEAD 2>/dev/null || echo "")
      if [ -z "$CHANGED_FILES" ]; then
        echo "No changed files"
