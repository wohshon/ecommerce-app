# ----------------------
# AI Risk Analysis Job
# ----------------------
ai-risk-analysis:
  stage: ai_decide_tests
  # image: python:3.11
  image: registry.wskn.local/wohshon/gitlab-ci-tools
#  before_script:
#    - apt-get update && apt-get install -y jq curl git
#    - pip install requests
  script:
    - |
      echo "Collecting changed files..."
      TARGET_BRANCH=${CI_MERGE_REQUEST_TARGET_BRANCH:-$(git remote show origin | awk '/HEAD branch/ {print $NF}')}
      echo "Comparing current branch ($CI_COMMIT_REF_NAME) with target ($TARGET_BRANCH)"
      git fetch origin "$TARGET_BRANCH" || echo "⚠️ Failed to fetch target branch, continuing with HEAD only"
      # CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
      CHANGED_DIFF=$(git diff HEAD~1 HEAD || echo "")
      if [ -z "$CHANGED_DIFF" ]; then
        echo "No changed files"
      else
        echo "Changed Diff: $CHANGED_DIFF"
      fi
      
      ESCAPED_DIFF=$(printf '%s' "$CHANGED_DIFF" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

      PROMPT="You are a CI/CD assistant. Based on these changed files:

      $ESCAPED_DIFF

      Classify risk per file:
      - negligible: comment-only → skip tests
      - Low: formatting, whitespaces → unit tests
      - Medium: function rename/refactor → run integration tests
      - High: variable/config/API change → run unit + integration tests

      Respond with pure JSON only.
      Do NOT include any Markdown, quotes, or code fences.
      Only include the fields: unit_tests and integration_tests, and the respective changed files that require testing under the right test.
      Example: {\"unit_tests\": [\"service1\"], \"integration_tests\": []}
      "

      # echo $AI_ENDPOINT_URL
      # echo $AI_API_KEY
      RESPONSE=$(jq -n --arg prompt "$PROMPT" \
        '{
          model: "qwen3-coder-30b-a3b",
          messages: [
            {role: "system", content: "You are a CI/CD assistant that is very proficient in analysing codes changes and their impact."},
            {role: "user", content: $prompt}
          ],
          max_tokens: 256,
          stream: false
        }' | curl -s -k "$AI_ENDPOINT_URL" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $AI_API_KEY" \
          -d @-)
      ## RAW RESPONSE
      echo "AI Response: $RESPONSE"
      # Extract content safely and fallback to empty arrays
      RESPONSE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "{\"unit_tests\":[],\"integration_tests\":[]}"')

      # Remove quotes if stringified
      RESPONSE=$(echo "$RESPONSE" | sed 's/^"\(.*\)"$/\1/' | sed 's/\\"/"/g')

      # Validate JSON, fallback if invalid
      echo "$RESPONSE" | jq '.' > test_selection.json || echo '{"unit_tests":[],"integration_tests":[]}' > test_selection.json
  artifacts:
    paths:
      - test_selection.json

# ----------------------
# Simulated Unit Test Job
# ----------------------
run-unit-tests:
  stage: ai_decide_tests
  # image: python:3.11
  image: registry.wskn.local/wohshon/gitlab-ci-tools
  needs:
    - job: ai-risk-analysis
      artifacts: true
#  before_script:
#    - apt-get update && apt-get install -y jq
  script:
    - UNIT_TESTS=$(jq -c '.unit_tests // []' test_selection.json)
    - "echo \"Running unit tests for: $UNIT_TESTS (simulated)\""
    - |
      echo "$UNIT_TESTS" | jq -r '.[]? // empty' | while read service; do
        echo "Unit tests for $service executed (simulated)"
      done
  rules:
    - when: always

# ----------------------
# Simulated Integration Test Job
# ----------------------
run-integration-tests:
  stage: ai_decide_tests
  # image: python:3.11
  image: registry.wskn.local/wohshon/gitlab-ci-tools
  needs:
    - job: ai-risk-analysis
      artifacts: true
#  before_script:
#    - apt-get update && apt-get install -y jq
  script:
    - INTEGRATION_TESTS=$(jq -c '.integration_tests // []' test_selection.json)
    - "echo \"Running integration tests for: $INTEGRATION_TESTS (simulated)\""
    - |
      echo "$INTEGRATION_TESTS" | jq -r '.[]? // empty' | while read service; do
        echo "Integration tests for $service executed (simulated)"
        if [ "$service" = "payment-service" ]; then
          echo "🚨 High-risk test failed for $service!"
          exit 1
        fi
      done
  rules:
    - when: always
# ----------------------
# Trigger infra for any built service
# ----------------------
trigger-infra:
  stage: trigger
  # image: curlimages/curl:latest
  image: registry.wskn.local/wohshon/gitlab-ci-tools
  # image: alpine:latest
  variables:
    CI_API_V4_URL: "https://gitlab.wskn.local/api/v4"
    INFRA_PROJECT_ID: "2"  # Replace with your actual infra project ID
  dependencies:
    - build-frontend
    - build-order-service
    - build-payment-service
    - build-product-service
  needs:
    - job: run-unit-tests
    - job: run-integration-tests  
    - job: build-frontend
      optional: true
    - job: build-order-service
      optional: true
    - job: build-payment-service
      optional: true
    - job: build-product-service
      optional: true
  before_script:
    - echo "triggering infra pipeline"   
  script:
    - "echo $REGISTRY_URL"
    - "echo $DOCKER_USERNAME"
    - "echo $IMAGE_DIGEST"
    - "echo $CI_API_V4_URL"
    - "echo $INFRA_PROJECT_ID"
    - "echo $SERVICE_NAME"
    - "echo"
    - |
      echo "Checking built services to trigger infra pipeline..."
      for artifact in frontend.env order.env payment.env product.env; do
        if [ -f "$artifact" ]; then
          echo "found artifact -  $artifact"
          source "$artifact"
          if [ -n "$SERVICE_NAME" ] && [ -n "$IMAGE_DIGEST" ]; then
            echo "Triggering infra pipeline for $SERVICE_NAME..."
            curl -k -X POST \
              -F token=$TRIGGER_TOKEN \
              -F ref=dev \
              -F "variables[SERVICE_NAME]=$SERVICE_NAME" \
              -F "variables[APP_IMAGE]=$IMAGE_DIGEST" \
              -F "commit_message=$CURRENT_COMMIT_MSG" \
              "$CI_API_V4_URL/projects/$INFRA_PROJECT_ID/trigger/pipeline"
          fi
        fi
      done
  rules:
    - when: always
