# ----------------------
# Trigger infra for any built service
# ----------------------
trigger-infra:
  stage: trigger
  image: curlimages/curl:latest
  # image: alpine:latest
  variables:
    CI_API_V4_URL: "https://gitlab.wskn.local/api/v4"
    INFRA_PROJECT_ID: "2"  # Replace with your actual infra project ID
  dependencies:
    - build-frontend
    - build-order-service
    - build-payment-service
    - build-product-service
  needs:
    - job: build-frontend
      optional: true
    - job: build-order-service
      optional: true
    - job: build-payment-service
      optional: true
    - job: build-product-service
      optional: true
  before_script:
    - echo "triggering infra pipeline"   
  script:
    - "echo $REGISTRY_URL"
    - "echo $DOCKER_USERNAME"
    - "echo $IMAGE_DIGEST"
    - "echo $CI_API_V4_URL"
    - "echo $INFRA_PROJECT_ID"
    - "echo $SERVICE_NAME"
    - "echo"
    - |
      echo "Checking built services to trigger infra pipeline..."
      for artifact in frontend.env order.env payment.env product.env; do
        if [ -f "$artifact" ]; then
          echo "found artifact -  $artifact"
          source "$artifact"
          if [ -n "$SERVICE_NAME" ] && [ -n "$IMAGE_DIGEST" ]; then
            echo "Triggering infra pipeline for $SERVICE_NAME..."
            curl -k -X POST \
              -F token=$TRIGGER_TOKEN \
              -F ref=dev \
              -F "variables[SERVICE_NAME]=$SERVICE_NAME" \
              -F "variables[APP_IMAGE]=$IMAGE_DIGEST" \
              "$CI_API_V4_URL/projects/$INFRA_PROJECT_ID/trigger/pipeline"
          fi
        fi
      done
  rules:
    - when: always

# ----------------------
# AI Build Review Job
# ----------------------
ai-review:
  stage: ai_review
  image: curlimages/curl:latest
  script:
    - echo "Running AI Build Review..."
    - |
      for artifact in frontend.env order.env payment.env product.env; do
        if [ -f "$artifact" ]; then
          source "$artifact"
          echo "Analyzing build for $SERVICE_NAME..."
          # Read the last build logs
          LOG_FILE="${SERVICE_NAME}_build.log"
          if [ -f "$LOG_FILE" ]; then
            BUILD_LOG=$(tail -n 100 "$LOG_FILE")
          else
            BUILD_LOG="Build completed for $SERVICE_NAME, image: $IMAGE_DIGEST"
          fi
          echo "Build Log:"
          echo "$BUILD_LOG"
          # Send to AI endpoint
          echo "Sending build log to AI endpoint for analysis..."
        fi
      done
  variables:
    AI_ENDPOINT_URL: "https://<your-private-ai-endpoint>/v1/chat/completions"
  dependencies:
    - build-frontend
    - build-order-service
    - build-payment-service
    - build-product-service
  needs:
    - job: build-frontend
      optional: true
    - job: build-order-service
      optional: true
    - job: build-payment-service
      optional: true
    - job: build-product-service
      optional: true
  rules:
    - when: always
